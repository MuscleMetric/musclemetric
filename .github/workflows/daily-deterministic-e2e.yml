name: Daily deterministic history E2E

on:
  workflow_dispatch:
  schedule:
    # 02:05 UTC, ahead of the independent 03:17 UTC live tester smoke run.
    - cron: "5 2 * * *"

permissions:
  contents: read

concurrency:
  group: daily-deterministic-history-e2e
  cancel-in-progress: false

jobs:
  known_history:
    name: Fresh user / known training history / complete cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v7

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.119.0

      - name: Start disposable Supabase (no production credentials)
        run: supabase start

      - name: Reset ALL local data and apply repository migrations
        run: supabase db reset

      - name: Validate database behavioural tests
        run: supabase test db supabase/tests/database

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install pinned E2E dependencies
        run: npm ci

      - name: Run real authenticated history, RPC and failure-oracle E2E
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source <(supabase status -o env)
          set +a
          mkdir -p ci-artifacts
          node scripts/e2e/tester-workout-flow.cjs 2>&1 | tee ci-artifacts/daily-e2e.log

      - name: Keep 14 days of daily E2E results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-fixture-e2e-${{ github.run_number }}
          path: ci-artifacts/daily-e2e.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Report fixture isolation and coverage boundary
        if: always()
        shell: bash
        run: |
          {
            echo "## Daily deterministic MuscleMetric E2E"
            echo
            echo "- Real Supabase HTTP/Auth/RPC against a fresh throwaway Docker database"
            echo "- Known strength/cardio/mixed history, exact totals and direct-row verification"
            echo "- User isolation, no-history, retry, plan create/edit, backend availability and read contracts"
            echo "- Never connects to the production database or production tester account"
            echo "- No production secrets are supplied to this workflow"
            echo "- Local containers/data are stopped below; GitHub runner is ephemeral"
            echo "- Endpoint availability is wider than full behavioural coverage: dynamic RPCs, Edge Functions and iOS UI need separate expansion"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Destroy disposable database, users and workout history
        if: always()
        shell: bash
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup
          fi
