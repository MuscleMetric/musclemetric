name: Daily deterministic history E2E

on:
  workflow_dispatch:
  schedule:
    # 02:05 UTC, ahead of the independent 03:17 UTC live tester smoke run.
    - cron: "5 2 * * *"

permissions:
  contents: read

concurrency:
  group: daily-deterministic-history-e2e
  cancel-in-progress: false

jobs:
  known_history:
    name: All disposable database checks with Allure
    uses: ./.github/workflows/backend-regressions.yml
