name: Production deterministic history E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "13 4 * * *"

permissions:
  contents: read

# Serialize production tester writes with the existing live smoke workflow.
concurrency:
  group: live-tester-workout-e2e
  cancel-in-progress: false

jobs:
  production_reference:
    name: Production tester setup / checks / cleanup
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_PRODUCTION_FULL_E2E == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tested repository commit
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Verify tester credentials are set
        shell: bash
        env:
          E2E_TESTER_EMAIL: ${{ secrets.E2E_TESTER_EMAIL }}
          E2E_TESTER_PASSWORD: ${{ secrets.E2E_TESTER_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$E2E_TESTER_EMAIL" && test -n "$E2E_TESTER_PASSWORD"
          mkdir -p ci-artifacts
      - name: "Stage 1: Seed known production workout history"
        shell: bash
        env:
          E2E_TESTER_EMAIL: ${{ secrets.E2E_TESTER_EMAIL }}
          E2E_TESTER_PASSWORD: ${{ secrets.E2E_TESTER_PASSWORD }}
          MM_E2E_STATE_FILE: ci-artifacts/production-known-history-state.json
        run: |
          set -euo pipefail
          node scripts/e2e/production-known-history.cjs setup 2>&1 | tee ci-artifacts/setup.log
      - name: "Stage 2: Verify real RPC values, private posts, plans and failures"
        shell: bash
        env:
          E2E_TESTER_EMAIL: ${{ secrets.E2E_TESTER_EMAIL }}
          E2E_TESTER_PASSWORD: ${{ secrets.E2E_TESTER_PASSWORD }}
          MM_E2E_STATE_FILE: ci-artifacts/production-known-history-state.json
        run: |
          set -euo pipefail
          node scripts/e2e/production-known-history.cjs test 2>&1 | tee ci-artifacts/tests.log
      - name: "Stage 3: Delete tagged fixtures and validate restoration"
        if: always()
        shell: bash
        env:
          E2E_TESTER_EMAIL: ${{ secrets.E2E_TESTER_EMAIL }}
          E2E_TESTER_PASSWORD: ${{ secrets.E2E_TESTER_PASSWORD }}
          MM_E2E_STATE_FILE: ci-artifacts/production-known-history-state.json
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          node scripts/e2e/production-known-history.cjs cleanup 2>&1 | tee ci-artifacts/cleanup.log
      - name: Report outcome and boundaries
        if: always()
        shell: bash
        run: |
          {
            echo "## Production deterministic history E2E"
            echo
            echo "1. Setup: seed 3 marked workouts using the real production tester."
            echo "2. Tests: validate raw rows, actual workout/home/progress/cardio API data, private posts, plan operations and failure cases."
            echo "3. Cleanup: delete marked workout/post/plan/clone records and verify baseline."
            echo
            echo "- Existing production smoke test remains separate."
            echo "- Ordinary tester JWT only; no service-role token or SQL schema changes."
            echo "- Real API E2E, not full iOS simulator navigation or comprehensive behavioural coverage of every RPC."
            echo "- Daily schedule requires ENABLE_PRODUCTION_FULL_E2E=true."
            echo "- Cleanup is best-effort if GitHub kills the runner; failures must be investigated before retry."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload logs only (not credentials or cleanup manifest)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-known-history-e2e-${{ github.run_number }}
          path: |
            ci-artifacts/setup.log
            ci-artifacts/tests.log
            ci-artifacts/cleanup.log
          if-no-files-found: ignore
          retention-days: 14
