appId: com.musclemetric.app.e2e
name: Workout - enter a set, save and read history
---
- runFlow: helpers/login.yaml
- runFlow: helpers/log-set.yaml
- runFlow: helpers/save.yaml
- openLink: musclemetric://features/history/screens/WorkoutHistoryListScreen
- extendedWaitUntil:
    visible: Maestro Workout
    timeout: 30000
- tapOn: Maestro Workout
- assertVisible: '500 kg'
- assertVisible: Maestro Press
